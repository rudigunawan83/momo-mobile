org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
android.useAndroidX=true
# Flutter Gradle plugin belum kompatibel dengan android.newDsl=true (AGP 9.0)
android.newDsl=false
android.builtInKotlin=false
# Workaround: Kotlin incremental build gagal di Windows ketika
# pub cache (C:\) dan project (D:\) berada di drive berbeda.
# Ref: https://youtrack.jetbrains.com/issue/KT-55777
kotlin.incremental=false
