name: momo_ai
description: "Momo AI Companion - Flutter Mobile App for Momo AI Backend"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Async
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.3.0
  http: ^1.1.0

  # Routing
  go_router: ^12.0.0

  # Serialization & JSON
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Audio & Recording (tambahkan kembali saat implementasi audio)
  # record: ^5.2.1          ← record_linux 0.7.2 conflict dengan record_platform_interface 1.6.0
  # audioplayers: ^5.2.0    ← belum dipakai
  permission_handler: ^11.4.0

  # Camera (optional — untuk fitur visual)
  # camera: ^0.10.5

  # Voice/WebRTC
  livekit_client: ^2.11.0

  # Image caching
  cached_network_image: ^3.3.0

  # Environment config
  flutter_dotenv: ^5.1.0

  # Internationalization
  intl: ^0.19.0

  # UI/Animation
  google_fonts: ^6.1.0

  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env.dev
    - .env.staging
    - .env.prod

  # Font GoogleSans dimuat via google_fonts package (tidak perlu file lokal)
  # Untuk produksi offline: download dan tambahkan ke assets/fonts/
